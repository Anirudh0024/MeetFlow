[project]
name = "meetflow"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Anirudh" }
]
requires-python = ">=3.14"
dependencies = [
    "google-genai>=3.1.0",
    "langchain>=1.5.0",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.8.0",
    "langchain-google-genai>=4.4.3",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-text-splitters>=1.1.3",
    "openai-whisper>=20250625",
    "python-dotenv>=1.2.4",
    "recursivecharactertextsplitter>=0.1.0",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
    "yt-dlp>=2026.10.26",
]

[project.scripts]
meetflow = "meetflow:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
